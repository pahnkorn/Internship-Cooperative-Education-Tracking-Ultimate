<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดนักศึกษา | Internship Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">Internship Tracking</div>
    <div class="user-area">
        <a href="index.html" class="nav-link">หน้าหลัก</a>
        <a href="companies.html" class="nav-link">สถานประกอบการ</a>
        <span id="userName" class="user-name"></span>
        <form method="POST" action="/logout">
            <button type="submit" class="logout-btn">ออกจากระบบ</button>
        </form>
    </div>
</header>

<main class="container">
    <p><a href="index.html" class="back-link">← กลับไปรายชื่อ</a></p>
    <h1 id="studentName">กำลังโหลด...</h1>

    <section class="panel">
        <h2>ข้อมูลนักศึกษา</h2>
        <dl class="detail-list">
            <dt>รหัสนักศึกษา</dt>
            <dd id="detailCode">-</dd>
            <dt>ชื่อ-นามสกุล</dt>
            <dd id="detailName">-</dd>
            <dt>สาขา</dt>
            <dd id="detailMajor">-</dd>
        </dl>
        <p id="errorMessage" class="form-message error"></p>
    </section>
</main>

<script src="student.js"></script>
</body>
</html>
